<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315642"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>The Miaus Collection</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7efd9;color:#315642;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:16px 16px 100px}header{text-align:center;background:#315642;color:#fff;padding:24px 8px;border-bottom:4px solid #b99b50}header small{color:#e8d29a;letter-spacing:3px}h1{font-size:24px;margin:8px 0}h2{font-size:21px}section,.panel{background:#fff9e9;border:2px solid #c9b988;border-radius:10px;padding:16px;margin:14px 0} .hero{text-align:center;background:#e6e9ce}canvas{image-rendering:pixelated;width:144px;height:144px}progress{width:90%;accent-color:#315642;height:18px}button,.button{display:block;width:100%;padding:14px;border:0;border-radius:6px;background:#315642;color:white;font:inherit;font-weight:650;text-align:center;cursor:pointer}button.secondary{background:transparent;color:#315642;border:1px solid #315642;margin-top:8px}input[type=text]{width:100%;padding:12px;font:inherit;border:1px solid #a99b76;border-radius:6px;margin:8px 0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#315642;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px}nav button{font-size:14px}nav button.active{background:#e8d29a;color:#315642}.counts{display:flex;justify-content:space-around;text-align:center}.counts b{font-size:28px;display:block}.muted{color:#68745d;font-size:13px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{padding:12px;border:1px solid #c9b988;border-radius:6px;min-height:70px}.locked{background:#eee6cf;color:#827b66}.flowers{display:flex;justify-content:space-between;gap:4px}.flower{text-align:center;flex:1;font-size:11px}.flower canvas{width:48px;height:60px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{padding:8px;background:#e6e9ce;border-radius:4px}#notice{min-height:24px;text-align:center;font-weight:600}details{margin-top:18px}dialog{max-width:90%;border:2px solid #b99b50;border-radius:12px;background:#fff9e9;color:#315642;text-align:center}dialog::backdrop{background:#203b35aa}[hidden]{display:none!important}</style></head><body><header><small>✦ PIXEL ADVENTURE ✦</small><h1>THE MIAUS COLLECTION</h1></header><main><div id="profile"><section class="hero"><canvas id="cat" width="32" height="32"></canvas><h2 id="rank"></h2><progress id="xpbar"></progress><p id="xp"></p></section><section class="counts"><div><b id="count"></b>Karten</div><div><b id="flowercount"></b>Blumen</div></section><button id="scan">▣ Karte scannen</button><input id="photo" type="file" accept="image/*" capture="environment" hidden><button class="secondary" id="manual">Kartentitel manuell eingeben</button><form id="entry" hidden><input id="titleinput" type="text" placeholder="Vollständiger Kartentitel" autocomplete="off" required><button>Registrieren</button></form><p id="notice" role="status"></p><details><summary>Spielstand sichern</summary><button class="secondary" id="export">Sicherung exportieren</button><button class="secondary" id="restore">Sicherung importieren</button><input type="file" id="backup" accept="application/json" hidden></details></div><div id="collection" hidden><h2>Sammlung</h2><div id="slots" class="slots"></div><section><h2>Charakterwerte</h2><div id="stats" class="stats"></div><p id="bonus" class="muted"></p></section></div><div id="inventory" hidden><h2>Blumenquest</h2><section><div id="flowers" class="flowers"></div><div id="bouquet" hidden style="text-align:center"><canvas id="bunch" width="32" height="32"></canvas><h2>Der legendäre Miaus-Strauß</h2></div><p id="quest" class="muted"></p></section></div></main><nav><button data-tab="profile" class="active">⌂ Profil</button><button data-tab="collection">▤ Sammlung</button><button data-tab="inventory">✿ Inventar</button></nav><dialog id="reward"><h2 id="rewardtitle"></h2><p id="rewardtext"></p><button id="close">Weiter</button></dialog><script src="app.js"></script></body></html>
